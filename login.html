<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Acceso Administrador | Ilusion Perfumery</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    :root {
      --bg: #08080a;
      --card: #131319;
      --accent: #f5c518;
      --accent-hover: #ffd83b;
      --border: rgba(245, 197, 24, 0.28);
      --text: #f8fafc;
      --muted: #9ca3af;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 15%, rgba(245, 197, 24, 0.14) 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 36px 28px;
      box-shadow: 0 24px 65px rgba(0, 0, 0, 0.85);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .emblem {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent) 0%, #b8860b 100%);
      color: #08080a;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-weight: 800;
      font-size: 1.45rem;
      margin-bottom: 12px;
      box-shadow: 0 8px 25px rgba(245, 197, 24, 0.3);
    }

    .brand-header h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      color: #fff;
    }

    .brand-header p {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: #d1d5db;
      margin-bottom: 7px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap input {
      width: 100%;
      background: #0b0b0f;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 13px 42px 13px 14px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .input-wrap input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .toggle-pass {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
    }

    .alert-box {
      display: none;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 16px;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--accent) 0%, #dfa90b 100%);
      color: #08080a;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .back-store {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 600;
    }

    .back-store:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-header">
      <div class="emblem">IP</div>
      <h1>ILUSION PERFUMERY</h1>
      <p>Panel de Administración & Control Total</p>
    </div>

    <div class="alert-box" id="errorBox"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="emailInput">Correo Electrónico</label>
        <div class="input-wrap">
          <input type="email" id="emailInput" required autocomplete="username" placeholder="admin@ilusionperfumery.com" />
        </div>
      </div>

      <div class="form-group">
        <label for="passwordInput">Contraseña</label>
        <div class="input-wrap">
          <input type="password" id="passwordInput" required autocomplete="current-password" placeholder="••••••••••••" />
          <button type="button" class="toggle-pass" id="togglePassBtn" aria-label="Mostrar u ocultar contraseña">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Ingresar al Panel 🔒</button>
    </form>

    <a href="index.html" class="back-store">← Volver a la tienda pública</a>
  </div>

  <script>
    let supabaseClient = null;
    try {
      if (typeof SUPABASE_URL === 'string' && SUPABASE_URL.startsWith('http') && !SUPABASE_URL.includes('TU_PROYECTO')) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (e) {
      console.error(e);
    }

    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');
    const passInput = document.getElementById('passwordInput');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    document.getElementById('togglePassBtn').addEventListener('click', () => {
      passInput.type = passInput.type === 'password' ? 'text' : 'password';
    });

    // Verificar si ya hay sesión activa
    (async () => {
      if (!supabaseClient) {
        showError('⚠️ Configura SUPABASE_URL y SUPABASE_KEY en el archivo config.js para activar el inicio de sesión.');
        return;
      }
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        window.location.href = 'admin.html';
      }
    })();

    // Protección anti fuerza bruta en cliente
    let failedAttempts = Number(sessionStorage.getItem('ilusion_login_fails') || '0');
    let lockUntil = Number(sessionStorage.getItem('ilusion_login_lock') || '0');

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';

      const now = Date.now();
      if (now < lockUntil) {
        const waitSec = Math.ceil((lockUntil - now) / 1000);
        showError(`Demasiados intentos fallidos. Espera ${waitSec} segundos.`);
        return;
      }

      if (!supabaseClient) {
        showError('Falta configurar Supabase en config.js.');
        return;
      }

      const email = document.getElementById('emailInput').value.trim();
      const password = passInput.value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verificando credenciales...';

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error || !data.session) {
        failedAttempts += 1;
        sessionStorage.setItem('ilusion_login_fails', String(failedAttempts));
        if (failedAttempts >= 5) {
          lockUntil = Date.now() + 30000; // 30 segundos de bloqueo
          sessionStorage.setItem('ilusion_login_lock', String(lockUntil));
          showError('Has superado 5 intentos. Acceso bloqueado por 30 segundos.');
        } else {
          showError('Correo o contraseña incorrectos. Verifica tus datos en Supabase Auth.');
        }
        submitBtn.disabled = false;
        submitBtn.textContent = 'Ingresar al Panel 🔒';
        return;
      }

      sessionStorage.removeItem('ilusion_login_fails');
      sessionStorage.removeItem('ilusion_login_lock');
      window.location.href = 'admin.html';
    });
  </script>
</body>
</html>
